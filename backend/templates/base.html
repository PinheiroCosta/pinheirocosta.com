{% load render_bundle from webpack_loader %}
{% load static %}

<!DOCTYPE html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <title>{% block title %}Pinheiro Costa{% endblock %}</title>
  <meta name="description" content="Projetos, artigos e ferramentas web. Algumas resolvem problemas reais, outras só existem porque programar é divertido." />
  <meta property="og:title" content="Rômulo Pinheiro Costa — Projetos, artigos e ferramentas web" />
  <meta property="og:description" content="Projetos, artigos e ferramentas web. Algumas resolvem problemas reais, outras só existem porque programar é divertido." />
  <meta property="og:type" content="website" />
  <meta name="author" content="Rômulo Pinheiro Costa" />
  <meta name="contact" content="romulo@pinheirocosta.com">
  <meta name="keywords" content="django, react, python, linux, ferramentas, programação, tecnologia, desenvolvimento de software">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="{% static 'assets/favicon.ico' %}" type="image/x-icon">

  <!-- Webpack rendered CSS -->
  {% render_bundle 'main' 'css' %}
</head>

<body>
  {% include 'includes/sentry_init.html' %}

  <!-- Body Content -->
  {% block body %}{% endblock %}

  <!-- django-js-reverse -->
  <script src="{% url 'js_reverse' %}" type="text/javascript"></script>

  <!-- Webpack rendered Javascript -->
  {% render_bundle 'main' 'js' 'DEFAULT' %}
  {% block scripts %}{% endblock %}
</body>
</html>
